name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mac:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: brew install xcodegen swiftlint swiftformat
      - name: Lint
        run: scripts/lint.sh
      - name: Test packages
        run: scripts/test.sh
      - name: Build app (unsigned)
        run: scripts/build.sh CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY=""
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
