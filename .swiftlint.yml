included:
  - src/mac
  - scripts/spike
excluded:
  - src/mac/Packages/*/.build
  - scripts/spike/out
  - src/mac/Riftglass.xcodeproj
file_length:
  warning: 250
  error: 300
function_body_length:
  warning: 40
  error: 50
type_body_length:
  warning: 200
  error: 280
line_length:
  warning: 120
  error: 140
  ignores_comments: true
identifier_name:
  excluded: [id, x, y, ok, me, cs, q, w, e, r] # q/w/e/r: ability keys
opt_in_rules:
  - force_unwrapping
  - implicitly_unwrapped_optional
  - first_where
  - contains_over_first_not_nil
  - empty_count
disabled_rules:
  - todo
  - trailing_comma
